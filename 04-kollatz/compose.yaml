services:
  worker:
    build: ./app
    environment:
      REDIS_URL: redis://redis:6379
      CHUNK_SIZE: 10000      # сколько чисел в одном блоке (запоминается в Redis при первом запуске)
      LEASE_SECONDS: 30      # через сколько секунд "потерянный" блок отдаётся другому воркеру
      DELAY_MS: 500          # пауза между блоками, чтобы прогресс было видно
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10s
  redis:
    container_name: kollatz-redis
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:

